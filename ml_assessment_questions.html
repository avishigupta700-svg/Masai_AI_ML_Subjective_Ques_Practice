<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ML Assessment Questions</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Arial, sans-serif; background: #f5f5f5; color: #222; font-size: 14px; }

  .shell { display: flex; min-height: 100vh; }

  .sidebar { width: 200px; background: #fff; border-right: 1px solid #ddd; padding: 16px; flex-shrink: 0; }
  .sidebar h3 { font-size: 12px; color: #555; margin-bottom: 10px; font-weight: 600; }
  .nav-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; }
  .nav-btn { width: 28px; height: 28px; border: 1px solid #ccc; background: #fff; border-radius: 4px; font-size: 11px; cursor: pointer; display: flex; align-items: center; justify-content: center; color: #333; }
  .nav-btn.active { background: #1a56db; color: #fff; border-color: #1a56db; }
  .nav-btn:hover { background: #e8f0fe; }

  .main { flex: 1; padding: 24px; max-width: 800px; }

  .q-card { background: #fff; border: 1px solid #ddd; border-radius: 6px; padding: 24px; margin-bottom: 24px; display: none; }
  .q-card.visible { display: block; }

  .q-card h1 { font-size: 20px; font-weight: 700; color: #111; margin-bottom: 6px; }
  .q-card .intro { color: #444; margin-bottom: 12px; font-size: 13px; }

  .dataset-label { font-size: 14px; font-weight: 700; margin-bottom: 8px; }
  .dataset-label code { background: #f0f0f0; padding: 2px 6px; border-radius: 4px; font-size: 13px; }

  .csv-box { background: #1e1e2e; color: #cdd6f4; font-family: 'Courier New', monospace; font-size: 11px; padding: 12px; border-radius: 6px; overflow-x: auto; white-space: pre; margin-bottom: 16px; line-height: 1.6; }

  .contains-label { color: #555; font-size: 13px; margin-bottom: 4px; }
  .contains-list { list-style: disc; padding-left: 20px; margin-bottom: 16px; }
  .contains-list li { color: #444; font-size: 13px; margin-bottom: 2px; }

  .tasks-title { font-size: 17px; font-weight: 700; margin-bottom: 8px; border-top: 1px solid #eee; padding-top: 14px; }
  .tasks-intro { font-size: 13px; color: #555; margin-bottom: 14px; }

  .task-section { margin-bottom: 14px; }
  .task-section h3 { font-size: 14px; font-weight: 700; color: #111; margin-bottom: 6px; }
  .task-section ul { list-style: disc; padding-left: 20px; }
  .task-section li { font-size: 13px; color: #444; margin-bottom: 3px; }

  .section-divider { border: none; border-top: 1px solid #eee; margin: 14px 0; }

  .instructions-title { font-size: 17px; font-weight: 700; margin: 16px 0 8px; }
  .instructions-list { list-style: disc; padding-left: 20px; margin-bottom: 16px; }
  .instructions-list li { font-size: 13px; color: #444; margin-bottom: 3px; }
  .instructions-list ul { list-style: circle; padding-left: 18px; margin-top: 4px; }

  .score-bar { display: flex; align-items: center; gap: 8px; background: #fafafa; border: 1px solid #ddd; border-radius: 4px; padding: 8px 12px; margin-top: 16px; }
  .score-icon { width: 18px; height: 18px; background: #1a56db; border-radius: 3px; }
  .score-text { font-size: 13px; font-weight: 600; color: #333; }

  .nav-footer { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
  .nav-footer button { padding: 7px 18px; border-radius: 4px; font-size: 13px; cursor: pointer; border: 1px solid #bbb; background: #fff; color: #333; }
  .nav-footer button.primary { background: #1a56db; color: #fff; border-color: #1a56db; }
  .nav-footer button:hover { opacity: 0.85; }

  .logo { font-size: 16px; font-weight: 800; color: #1a56db; margin-bottom: 20px; letter-spacing: -0.5px; }
  .q-number { font-size: 11px; color: #999; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
</style>
</head>

let current = 0;

function buildNav() {
  const grid = document.getElementById('navGrid');
  questions.forEach((_, i) => {
    const btn = document.createElement('div');
    btn.className = 'nav-btn' + (i === 0 ? ' active' : '');
    btn.textContent = i + 1;
    btn.onclick = () => goTo(i);
    grid.appendChild(btn);
  });
}

function renderQuestion(idx) {
  const q = questions[idx];
  return `
    <div class="q-number">Question ${idx + 1} of ${questions.length}</div>
    <h1>${q.title}</h1>
    <p class="intro">${q.intro}</p>
    <p class="dataset-label">Dataset: <code>${q.datasetName}</code></p>
    <div class="csv-box">${q.csv}</div>
    <p class="contains-label">The dataset contains:</p>
    <ul class="contains-list">
      ${q.contains.map(c => `<li>${c}</li>`).join('')}
    </ul>
    <hr class="section-divider">
    <p class="tasks-title">Tasks</p>
    <p class="tasks-intro">${q.taskIntro}</p>
    ${q.tasks.map(t => `
      <div class="task-section">
        <h3>${t.heading}</h3>
        <ul>${t.items.map(i => `<li>${i}</li>`).join('')}</ul>
      </div>
      <hr class="section-divider">
    `).join('')}
    <p class="instructions-title">Instructions</p>
    <ul class="instructions-list">
      <li>Write clean and readable Python code</li>
      <li>You may either:
        <ul>
          <li>Create the DataFrame directly from the given data, or</li>
          <li>Save the dataset as <code>${q.datasetName}</code> and load it</li>
        </ul>
      </li>
    </ul>
    <p class="instructions-title">Submission Guidelines</p>
    <ul class="instructions-list">
      <li>You may use external IDEs such as Google Colab, Jupyter Notebook, or VS Code</li>
      <li>Usage of AI tools, AI assistants, or AI-based extensions is strictly prohibited</li>
      <li>Paste only the complete final code in the answer box</li>
      <li>Do not include:
        <ul>
          <li>Links</li><li>Repository URLs</li><li>Notebook links</li>
          <li>Drive links</li><li>Screenshots</li><li>File attachments</li>
        </ul>
      </li>
      <li>Only the full code solution should be submitted.</li>
    </ul>
    <div class="score-bar">
      <div class="score-icon"></div>
      <span class="score-text">Score: 0</span>
    </div>
    <div class="nav-footer">
      ${idx > 0 ? `<button onclick="goTo(${idx - 1})">&#8592; PREVIOUS</button>` : ''}
      ${idx < questions.length - 1 ? `<button class="primary" onclick="goTo(${idx + 1})">NEXT &#8594;</button>` : ''}
    </div>
  `;
}

function goTo(idx) {
  current = idx;
  document.getElementById('mainContent').innerHTML = renderQuestion(idx);
  document.querySelectorAll('.nav-btn').forEach((b, i) => {
    b.classList.toggle('active', i === idx);
  });
  window.scrollTo(0, 0);
}

buildNav();
goTo(0);
</script>

</html>
